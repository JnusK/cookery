<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <linearGradient id="steamGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="black">
                <animate attributeName="stop-color" attributeType="CSS" begin="0s" values="white;black;white" dur="5s" repeatCount="indefinite" />
            </stop>
            <stop offset="100%" stop-color="white">
                <animate attributeName="stop-color" attributeType="CSS" begin="0s" values="black;white;black" dur="5s" repeatCount="indefinite" />
            </stop>
        </linearGradient>
    </defs>
    <!-- Bowl -->
    <path
        d="M 20 60 C 10 90, 90 90, 80 60 Z"
        id="bowl"
        stroke="black"
        stroke-width="3"
        fill="transparent"
    />
    <!-- Steam -->
    <path
        d="M 30 50 C 10 20, 50 40, 30 10"
        id="steam"
        stroke="url(#steamGradient)"
        stroke-width="2"
        fill="transparent"
    />
    <path
        d="M 50 50 C 30 20, 70 40, 50 10"
        id="steam"
        stroke="url(#steamGradient)"
        stroke-width="2"
        fill="transparent"
    />
    <path
        d="M 70 50 C 50 20, 90 40, 70 10"
        id="steam"
        stroke="url(#steamGradient)"
        stroke-width="2"
        fill="transparent"
    />
</svg>
